<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Business Assistant</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="chat-container">

    <div class="header">

      <div class="bot-avatar">
        🤖
      </div>

      <div class="header-info">
        <h2>Business Assistant</h2>
        <p><span class="online">●</span> Online</p>
      </div>

    </div>


    <div id="chat">

      <div class="message bot">
        Hi! 👋 Welcome to our business.<br>
        How can I help you today?
      </div>

    </div>


    <div class="buttons">

      <button onclick="quickReply('price')">
        💰 Price
      </button>

      <button onclick="quickReply('timing')">
        🕐 Opening Hours
      </button>

      <button onclick="quickReply('booking')">
        📅 Book Appointment
      </button>

      <button onclick="quickReply('contact')">
        📞 Contact
      </button>

    </div>


    <div class="input-area">

      <input
        id="userInput"
        type="text"
        placeholder="Type your question..."
        onkeydown="if(event.key==='Enter') sendMessage()"
      >

      <button class="send" onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>


  <script>

    function addMessage(text, type) {

      const chat = document.getElementById("chat");

      const message = document.createElement("div");

      message.className = "message " + type;

      message.innerText = text;

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }


    function botReply(text) {

      setTimeout(function() {

        addMessage(text, "bot");

      }, 400);

    }


    function quickReply(type) {

      if (type === "price") {

        addMessage("What are your prices?", "user");

        botReply(
          "Our haircut starts from ₹150. For other services, please contact us."
        );

      }


      else if (type === "timing") {

        addMessage("What are your opening hours?", "user");

        botReply(
          "We are open from 10:00 AM to 8:00 PM, Monday to Sunday."
        );

      }


      else if (type === "booking") {

        addMessage("I want to book an appointment.", "user");

        botReply(
          "Sure! Please type your name and preferred appointment time."
        );

      }


      else if (type === "contact") {

        addMessage("How can I contact you?", "user");

        botReply(
          "You can contact us at +91 XXXXX XXXXX."
        );

      }

    }


    function sendMessage() {

      const input = document.getElementById("userInput");

      const text = input.value.trim();

      if (text === "") return;

      addMessage(text, "user");

      input.value = "";

      const lower = text.toLowerCase();


      if (
        lower.includes("price") ||
        lower.includes("cost") ||
        lower.includes("rate")
      ) {

        botReply(
          "Our haircut starts from ₹150. Please contact us for other service prices."
        );

      }


      else if (
        lower.includes("time") ||
        lower.includes("open") ||
        lower.includes("close")
      ) {

        botReply(
          "We are open from 10:00 AM to 8:00 PM."
        );

      }


      else if (
        lower.includes("book") ||
        lower.includes("appointment")
      ) {

        botReply(
          "Sure! Please send your name and preferred appointment time."
        );

      }


      else if (
        lower.includes("contact") ||
        lower.includes("phone")
      ) {

        botReply(
          "You can contact us at +91 XXXXX XXXXX."
        );

      }


      else {

        botReply(
          "Thanks for your message! Please tell us what service you are interested in."
        );

      }

    }

<script src="script.js"></script>
</body>
</html>
